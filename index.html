<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة المستخدم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- العنوان / الرصيد -->
    <div class="title-cotent" id="title-cotent">
        <span class="Money" id="Money"></span>
    </div>

    <!-- محتوى ديناميكي -->
    <div class="content" id="content"></div>

    <!-- الطلب -->
    <div class="bley">
        <div id="demand"></div>

        <input type="number" id="bley.id" placeholder="أدخل ID">
        <button id="bley.submit" onclick="sendBill()">إرسال الطلب</button>
    </div>

    <!-- جدول الطلبات -->
    <div class="table-div">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th>معرف الطلب</th>
                    <th>اسم المنتج</th>
                    <th>الايدي</th>
                    <th>حالة الطلب</th>
                </tr>
            </thead>
            <tbody id="get-bill-product_id"></tbody>
        </table>
    </div>

    <!-- Scripts -->
    <script src="jave.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
