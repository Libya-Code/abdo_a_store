<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div id="login-container" class="login-container">
        <h2>تسجيل الدخول</h2>
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="ادخل بريدك الإلكتروني" required>
        <br>
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="ادخل كلمة المرور" required>
        <div class="d-grid gap-2 col-6 mx-auto">
            <button class="btn btn-primary" id="login-submit" type="submit">تسجيل الدخول </button>
        </div>
    </div>
    <div class="spinner-grow text-light" role="status">
  <span class="visually-hidden">Loading...</span>
</div>
</body>
<script src="jave.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
